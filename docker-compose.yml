version: '3.9'

services:
  # ── MongoDB Database ─────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: multitenant_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: multitenant_saas
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Mongo Express (optional DB UI) ──────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: multitenant_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - '8081:8081'
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - tools

volumes:
  mongo_data:
    driver: local
